      <title id="eva-architecture-title">EVA analysis module structure</title>
      <desc id="eva-architecture-desc">main.py wires console, data loading and plotting modules into EvaApp, which calls a pure analysis module; only the edge modules touch the terminal, the JSON file and Matplotlib.</desc>
