<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eva-comparison-sequence-title eva-comparison-sequence-desc" id="comparison-sequence-root">
      <title id="eva-comparison-sequence-title">FR22 country comparison sequence</title>
      <desc id="eva-comparison-sequence-desc">EvaApp asks ConsoleInput for two countries and a year range, re-asking until each answer is valid, then calls analysis to compare them and ConsoleOutput to print the result.</desc>
